[package]
name = "rekordbox-to-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "rekordbox-to-engine"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
flate2 = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
